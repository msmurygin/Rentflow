[package]
name = "rentflow"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = "1.43.0"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "uuid", "rust_decimal", "json", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
rust_decimal_macros = "1.40.0"
